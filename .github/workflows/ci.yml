name: CI - Test bmm-lib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test bmm-lib
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    defaults:
      run:
        working-directory: src-tauri/bmm-lib
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
          components: rustfmt, clippy
      
      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/bmm-lib/../lovely-injector/target  # Cache lovely-injector's target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/bmm-lib/Cargo.lock', 'src-tauri/bmm-lib/../lovely-injector/Cargo.lock') }}
      
      - name: Run tests
        
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cargo build --release --manifest-path=../lovely-injector/Cargo.toml
          fi
          cargo test -p bmm-lib -- --test-threads=1
