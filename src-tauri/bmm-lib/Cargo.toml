[package]
name = "bmm-lib"
version = "0.4.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# bincode 3.0.0 ships with no cargo features (no `serde`) and would change the
# on-disk cache format; pinned to 2.x intentionally.
bincode = { version = "2.0", features = ["serde"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
env_logger = "0.11.11"
flate2 = { version = "1", default-features = false, features = [
	"rust_backend",
] }
infer = "0.19.0"
lazy_static = "1.5.0"
libc = "0.2.189"
libflate = "2.3.1"
log = "0.4.33"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
tar = "0.4.46"
tauri = "2.11.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
scopeguard = "1.2.0"
mockito = "1.7.2"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
rstest = "0.26.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
sysinfo = "0.39"

[target.'cfg(unix)'.dependencies]
libproc = "0.14.11"
home = "0.5.12"
# libloading = "0.8.6"

[build-dependencies]
dirs = "6.0.0"
